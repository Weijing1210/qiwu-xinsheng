plaster:['观察缺损部位的范围、器壁厚度与原有轮廓，记录现状，确定需要补配的区域。','根据器物曲面设置适合的模具或临时支撑，为后续填补提供形状依据。','按方案在缺损区域逐步填补石膏材料，并塑造与原器形衔接的轮廓。','待填补部分稳定后整理表面，根据展示方案进行修色，同时保留对原件与补配部分的识别。'],
resin:['结合器物材质与损伤情况，评估树脂的相容性、稳定性及后续可去除性，选择合适的处理方案。','检查接合面，按方案清理并试拼残片，确认位置与接缝关系。','根据方案使用选定的树脂材料进行黏接或补配，固定残片并等待材料稳定。','检查黏接或补配区域，整理外形与表面，使其与器物轮廓协调，并记录处理结果。']};
function stepDescription(c,st,i){return st.description?.trim()||(st.name===c.steps[i]?window.QIWU_CRAFT_CONTENT[c.id].steps[i]?.description||processDescriptions[c.id][i]:'该步骤的详细介绍待补充。')}
function renderProcess(c,idx){const cfg=processConfig(c);return `<div class="process-carousel"><button class="process-arrow prev" aria-label="上一步骤" onclick="slideProcess(-1)">←</button><div class="process-window"><div class="process" tabindex="0" aria-label="${escapeHTML(c.name)}修复流程，可左右滚动" onscroll="updateProcessEdges(this)">${cfg.steps.map((st,i)=>`<div class="step"><button class="step-trigger" type="button" aria-expanded="false" aria-label="查看${escapeHTML(st.name)}介绍" data-step-index="${i}" onclick="toggleStepDetail(this)"><span class="step-art">${st.image?`<img src="${st.image}" alt="${escapeHTML(st.name)}">`:cfg.wide?`<span class="step-crop" style="background-image:url(&quot;${cfg.wide}&quot;);background-size:${cfg.steps.length*100}% 100%;background-position:${cfg.steps.length===1?0:i/(cfg.steps.length-1)*100}% 50%"></span>`:vessel(idx,Math.min(i,3))}</span></button><b>${escapeHTML(st.name)}</b></div>`).join('')}</div><section class="process-story" hidden aria-label="步骤介绍"><button class="story-close" aria-label="收起步骤介绍" onclick="closeProcessStory()">×</button><div class="story-content"><span class="story-kicker">修复步骤</span><h3 id="story-title"></h3><p id="story-text"></p></div></section></div><button class="process-arrow next" aria-label="下一步骤" onclick="slideProcess(1)">→</button></div>`}
function toggleStepDetail(button){const index=Number(button.dataset.stepIndex),cfg=processConfig(currentCraft),st=cfg.steps[index];if(!st)return;const wasOpen=button.getAttribute('aria-expanded')==='true';closeProcessStory(false);if(wasOpen)return;button.setAttribute('aria-expanded','true');const frame=button.closest('.process-window');frame.classList.add('story-open');frame.querySelector('#story-title').textContent=st.name;frame.querySelector('#story-text').textContent=stepDescription(currentCraft,st,index);const story=frame.querySelector('.process-story');story.hidden=false;story.querySelector('.story-close').focus()}
function closeProcessStory(restore=true){const selected=document.querySelector('.step-trigger[aria-expanded="true"]');document.querySelectorAll('.process-window').forEach(frame=>{frame.classList.remove('story-open');const story=frame.querySelector('.process-story');if(story)story.hidden=true});document.querySelectorAll('.step-trigger').forEach(el=>el.setAttribute('aria-expanded','false'));if(restore&&selected)selected.focus()}
function slideProcess(direction){closeProcessStory(false);const el=document.querySelector('.process-window .process'),step=el?.querySelector('.step');if(!el||!step)return;el.scrollBy({left:direction*(step.getBoundingClientRect().width+(parseFloat(getComputedStyle(el).columnGap)||0)),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProcessStory()});
function updateProcessEdges(el){const frame=el.parentElement,carousel=frame.parentElement,left=el.scrollLeft>3,right=el.scrollWidth-el.clientWidth-el.scrollLeft>3;frame.classList.toggle('fade-left',left);frame.classList.toggle('fade-right',right);const prev=carousel.querySelector('.prev'),next=carousel.querySelector('.next');if(prev)prev.disabled=!left;if(next)next.disabled=!right}
function refreshProcessEdges(){const el=document.querySelector('.process-window .process');if(el)updateProcessEdges(el)}
window.addEventListener('resize',refreshProcessEdges);
function addProcessStep(){editorDraft.steps.push({name:'新增步骤',image:'',description:''});drawProcessEditor();const fields=document.querySelectorAll('.editor-step input[type=text]');fields[fields.length-1]?.focus()}
function removeProcessStep(i){if(editorDraft.steps.length<2)return;editorDraft.steps.splice(i,1);drawProcessEditor()}
function openProcessEditor(){editorDraft=JSON.parse(JSON.stringify(processConfig(currentCraft)));editorDraft.steps.forEach((st,i)=>{st.description=stepDescription(currentCraft,st,i)});drawProcessEditor()}
function drawProcessEditor(){const idx=crafts.indexOf(currentCraft);$('#dialog-root').innerHTML=`<div class="modal-backdrop"><section class="modal editor" role="dialog" aria-modal="true" aria-label="编辑修复步骤"><button class="escape" aria-label="关闭" onclick="closeModal()">×</button><h2>编辑${currentCraft.name}修复步骤</h2><p class="editor-note">可自由新增、删除步骤，上传图片并修改名称，或使用一张自带步骤文字的完整流程图。图片会完整显示，不裁切。<br><strong>保存仅对当前浏览器生效，不会修改其他访客看到的内容。</strong>导出配置后可发回给我，用于正式更新网站。</p><div class="editor-toolbar"><label class="upload-label">上传整张流程图<input hidden type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadProcessImage(this,-1)"></label>${editorDraft.wide?'<button class="secondary" onclick="editorDraft.wide=\'\';drawProcessEditor()">改用分步图片</button>':''}</div>${editorDraft.wide?`<img class="editor-wide-preview" src="${editorDraft.wide}" alt="整张流程图预览">`:''}<div class="editor-grid">${editorDraft.steps.map((st,i)=>`<div class="editor-step">${st.image?`<img src="${st.image}" alt="步骤${i+1}预览">`:vessel(idx,Math.min(i,3))}<label for="step-name-${i}">步骤 ${String(i+1).padStart(2,'0')} 名称</label><input id="step-name-${i}" type="text" maxlength="40" value="${escapeHTML(st.name)}" oninput="editorDraft.steps[${i}].name=this.value"><label for="step-desc-${i}">步骤介绍</label><textarea id="step-desc-${i}" maxlength="2000" rows="5" oninput="editorDraft.steps[${i}].description=this.value">${escapeHTML(st.description||'')}</textarea><label class="upload-label">替换图片<input hidden type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadProcessImage(this,${i})"></label>${st.image?`<button class="secondary" onclick="editorDraft.steps[${i}].image='';drawProcessEditor()">恢复图案</button>`:''}<button class="secondary" ${editorDraft.steps.length===1?'disabled':''} onclick="removeProcessStep(${i})" aria-label="删除步骤 ${i+1}">删除步骤</button></div>`).join('')}</div><div class="editor-toolbar"><button class="primary" onclick="addProcessStep()">＋ 新增步骤</button><button class="secondary" onclick="exportProcessConfig()">导出配置</button><label class="upload-label">导入配置<input hidden type="file" accept="application/json,.json" onchange="importProcessConfig(this)"></label><button class="secondary" onclick="editorDraft=defaultProcessConfig(currentCraft);drawProcessEditor()">恢复默认</button></div><p class="editor-status" id="editor-status" role="status"></p><div class="actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="saveProcessConfig()">保存到当前浏览器</button></div></section></div>`;$('.editor .escape').focus()}
async function uploadProcessImage(input,index){const f=input.files[0];if(!f)return;const status=$('#editor-status');if(!['image/png','image/jpeg','image/webp'].includes(f.type)){status.textContent='请选择 PNG、JPG 或 WebP 图片。';return}if(f.size>15*1024*1024){status.textContent='图片太大，请选择小于 15 MB 的图片。';return}status.textContent='正在读取图片…';try{const bitmap=await createImageBitmap(f),scale=Math.min(1,(index<0?1600:700)/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const data=canvas.toDataURL('image/webp',.88);if(index<0)editorDraft.wide=data;else editorDraft.steps[index].image=data;drawProcessEditor();$('#editor-status').textContent='图片已载入，点击保存应用。'}catch(e){status.textContent='图片读取失败，请换一张图片。'}}
function exportProcessConfig(){const data={...processEdits,[currentCraft.id]:editorDraft},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qiwu-process-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importProcessConfig(input){const f=input.files[0];if(!f)return;try{if(f.size>12000000)throw Error();const parsed=cleanProcessData(JSON.parse(await f.text()));if(!parsed[currentCraft.id])throw Error();editorDraft=parsed[currentCraft.id];drawProcessEditor();$('#editor-status').textContent='当前工艺配置已导入，请保存应用。'}catch(e){$('#editor-status').textContent='配置无效，或不包含当前工艺。'}}
function saveProcessConfig(){if(editorDraft.steps.some(s=>!s.name.trim())){$('#editor-status').textContent='请填写每一个步骤名称。';return}const next={...processEdits,[currentCraft.id]:editorDraft};try{localStorage.setItem(PROCESS_STORAGE,JSON.stringify(next));processEdits=next;closeModal();renderCraft()}catch(e){$('#editor-status').textContent='浏览器存储空间不足或不可用。请先导出配置，或缩小图片后重试。'}}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if($('#dialog-root .modal')&&e.key==='Tab'){const list=[...document.querySelectorAll('.modal button')],first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script><script src="./companion.js"></script></body></html>
